<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Making Safe Decisions in the Field</title>
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
<script>
  /* A minimal SCORM 2004 runtime, so the course runs on a website the way it
     would inside an LMS. Nothing is saved or sent anywhere, and every visit
     starts fresh. */
  (function () {
    var data = {
      "cmi._version": "1.0",
      "cmi.mode": "normal",
      "cmi.credit": "credit",
      "cmi.entry": "ab-initio",
      "cmi.completion_status": "unknown",
      "cmi.success_status": "unknown",
      "cmi.learner_id": "guest",
      "cmi.learner_name": "Guest",
      "cmi.location": "",
      "cmi.suspend_data": "",
      "cmi.launch_data": "",
      "cmi.total_time": "PT0H0M0S",
      "cmi.time_limit_action": "continue,no message",
      "cmi.interactions._count": "0",
      "cmi.objectives._count": "0",
      "cmi.comments_from_learner._count": "0",
      "cmi.comments_from_lms._count": "0"
    };
    function updateCount(element) {
      var match = /^cmi\.(interactions|objectives|comments_from_learner)\.(\d+)\./.exec(element);
      if (!match) { return; }
      var key = "cmi." + match[1] + "._count";
      var next = parseInt(match[2], 10) + 1;
      if (next > parseInt(data[key] || "0", 10)) { data[key] = String(next); }
    }
    window.API_1484_11 = {
      Initialize: function () { return "true"; },
      Terminate: function () { return "true"; },
      Commit: function () { return "true"; },
      GetValue: function (element) {
        return Object.prototype.hasOwnProperty.call(data, element) ? data[element] : "";
      },
      SetValue: function (element, value) {
        data[element] = String(value);
        updateCount(element);
        return "true";
      },
      GetLastError: function () { return "0"; },
      GetErrorString: function () { return ""; },
      GetDiagnostic: function () { return ""; }
    };
  })();
</script>
</head>
<body>
<iframe src="scormdriver/indexAPI.html" title="Making Safe Decisions in the Field" allow="autoplay; fullscreen"></iframe>
</body>
</html>
